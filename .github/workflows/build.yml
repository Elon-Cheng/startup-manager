name: Windows build and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -IsccPath "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: StartupManager-win-x64
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*-Setup.exe
            artifacts/packages/*.sha256
          if-no-files-found: error
